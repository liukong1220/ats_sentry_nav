minco_planner:
  ros__parameters:
    # P3 的唯一外部目标入口是 ats_goal_manager 的 /goal_pose/action；MINCO 不直接接收主题目标。
    goal_topic: ""
    global_plan_topic: ""
    goal_request_topic: /ats_goal_manager/planner_goal
    planner_status_topic: /minco/planning_status
    # 保留 raw path 和 marker 供脚本/RViz 检查，正式 reference 由目标管理器提交。
    candidate_reference_path_topic: /minco/reference_path_candidate
    reference_path_topic: /minco/reference_path
    planner_manages_emergency_stop: false
    runtime_safety_recheck_hz: 10.0
    runtime_safety_horizon_sec: 1.0
    swept_max_corner_step_cells: 0.5
    # A route that contains a narrow section stays in BODY_YAW_FOLLOW for the
    # whole immutable reference.  This avoids unsafe in-motion authority flips.
    body_yaw_follow_clearance: 0.55
    # Route profiles for slope/contact-sensitive segments may force this mode.
    force_body_yaw_follow: false
