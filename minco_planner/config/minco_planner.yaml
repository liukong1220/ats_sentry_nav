minco_planner:
  ros__parameters:
    # rc_esdf_map fuses static /map walls with local terrain semantics in odom.
    grid_topic: /rc_esdf/planning_grid
    goal_topic: goal_pose
    global_plan_topic: /plan
    raw_path_topic: minco/raw_path
    reference_path_topic: minco/reference_path
    debug_marker_topic: minco/debug_markers
    global_frame: odom
    robot_frame: gimbal_yaw_odom

    # Same obstacle convention as the current traversability / RC-ESDF bridge.
    obstacle_value_threshold: 50
    unknown_is_obstacle: true
    allow_diagonal: true
    search_algorithm: jps
    astar_fallback: true
    jps_max_expanded_nodes: -1
    # 0.57 m is just above the 0.515 m all-yaw radius of the configured
    # 0.70 x 0.55 m rectangle with its safety margin. At the 0.40 m RC-ESDF
    # resolution this also rejects occupied diagonal neighbours.
    jps_safe_distance: 0.57
    publish_unsafe_trajectory: false

    # S3 non-uniform-time MINCO translation trajectory limits.
    reference_speed: 1.5
    min_segment_time: 0.05
    sample_spacing: 0.12
    max_velocity: 2.0
    max_acceleration: 2.5
    max_time_scaling_iterations: 5
    time_scaling_factor: 1.25

    # The outer loop refines only MINCO inner points with signed RC-ESDF
    # gradients, then re-solves S3. A second pass uses the yaw reference and
    # the same rectangular samples as the final footprint gate.
    esdf_obstacle_optimization_enabled: true
    esdf_obstacle_clearance: 0.45
    esdf_obstacle_max_iterations: 6
    esdf_obstacle_control_point_spacing: 0.30
    esdf_obstacle_max_step: 0.10
    esdf_obstacle_max_deviation: 0.50
    esdf_footprint_optimization_enabled: true
    # Required gap from the safety-margin-expanded rectangle to an obstacle.
    esdf_footprint_clearance: 0.10
    esdf_footprint_sample_spacing: 0.10

    # Swerve chassis keeps independent yaw in open space and aligns to the
    # nearest forward/reverse path tangent only where RC-ESDF reports a corridor.
    # Compatibility modes: goal_heading, hold, path_tangent, clearance_aware.
    yaw_mode: clearance_aware
    yaw_rate_limit: 2.5
    narrow_clearance_enter: 0.55
    narrow_clearance_exit: 0.70

    footprint_length: 0.70
    footprint_width: 0.55
    footprint_safety_margin: 0.05
    # Repaired geometry is reprocessed by MINCO, but nearest-cell repair stays opt-in.
    local_repair_enabled: false
    local_repair_max_iterations: 2
    local_repair_search_radius: 0.35
