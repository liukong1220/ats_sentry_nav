# 实车（Nav2-free）唯一权威 ats_swerve_mpc 参数。
#
# 权威约定（P6 零.2/零.3）：实车 MPC 参数只从本文件读取，
# `node_params.yaml` 与 `reality/nav2_params.yaml` 不得再出现同名段。
# 与 `ats_swerve_mpc.yaml`（MuJoCo 回归，use_sim_time: true）互斥使用。
#
# 时序关系（P6 一.3）：
#   MPC 控制周期 $T_c = 1/20 = 0.05\,\mathrm{s}$；
#   授权/急停租约 $T_{lease} = 0.5\,\mathrm{s}$；
#   底盘 `cmd_vel_watchdog_timeout_ms = 300\,\mathrm{ms}$，
#   满足 $T_c < T_{watchdog} \le T_{lease}$，即底盘看门狗严于上层租约，
#   不存在"上层已判超时、底盘仍在执行"的窗口。
ats_swerve_mpc:
  ros__parameters:
    # 实车使用 wall clock；这是与 ats_swerve_mpc.yaml 的关键差异。
    use_sim_time: false

    odom_topic: /localization
    trajectory_topic: /minco/reference_path
    # 唯一执行授权。非空时 legacy Path 不能装载 tracker，
    # 单独的 Bool false 不能解除急停。
    execution_command_topic: /planner/execution_command
    execution_command_timeout: 0.5
    gimbal_status_topic: /gimbal/yaw_status
    # 实车默认要求真实云台 ack；受控抬轮 HIL 才可由 launch 覆盖为 false。
    require_gimbal_status: true
    gimbal_status_timeout: 0.5
    # Real hardware defaults to fake-yaw/chassis compatibility. The chassis
    # transform remains the only /cmd_vel publisher consumed by the serial base.
    command_topic: /cmd_vel_mpc
    emergency_stop_topic: /planner/emergency_stop
    localization_status_topic: /localization/status
    require_localization_status: true
    emergency_stop_timeout: 0.5
    frame_id: odom
    control_rate_hz: 20.0
    fallback_path_dt: 0.1
    trajectory_timeout: 0.5
    goal_position_tolerance: 0.08
    goal_yaw_tolerance: 0.15
    publish_debug_paths: true

    # 默认保持 iLQR 唯一 `/cmd_vel_mpc` owner。qp_shadow 仅记录 OSQP 诊断；
    # qp 控制发布尚未实现，传入 solver_mode:=qp 会拒绝启动。
    solver_mode: ilqr
    # OSQP v1.0.0 固定 CSC workspace 限制，尚非 HIL/实车实时性测量值。
    qp_max_iterations: 400
    qp_time_limit_ms: 10.0
    qp_max_primal_residual: 1.0e-4
    qp_max_dual_residual: 1.0e-4
    qp_max_tracking_slack: 0.0
    qp_max_hard_constraint_violation: 1.0e-7
    # 实车默认不启用性能采样窗口；仅受控离线/仿真 profile 可以显式覆盖。
    telemetry_sampling_window_cycles: 0

    projection_backward_window: 0.20
    projection_forward_window: 2.00
    cross_track_slowdown_start: 0.15
    cross_track_slowdown_end: 0.60
    min_reference_progress_scale: 0.25
    command_latency_compensation: 0.01

    # horizon * dt = 30 * 0.05 = 1.5 s，覆盖 max_vx=1.5 m/s 的一次完整制动。
    horizon: 30
    # 必须等于控制周期 1/control_rate_hz = 0.05 s。
    dt: 0.05
    max_iterations: 6
    regularization: 1.0e-5
    line_search_decay: 0.5
    min_line_search_step: 0.05
    convergence_tolerance: 1.0e-3

    state_weight: [18.0, 18.0, 4.0]
    terminal_weight: [28.0, 28.0, 8.0]
    control_weight: [0.12, 0.12, 0.08]
    control_delta_weight: [0.7, 0.7, 0.25]

    # 可行域：出口级（底盘/变换级）不得比这里更宽松。
    max_vx: 1.5
    max_vy: 1.5
    max_wz: 2.0
    max_ax: 2.0
    max_ay: 2.0
    max_awz: 3.0
    # 底盘中心到前/后轮心的 x 半轴偏置（m），不是完整轮心距。
    wheel_base_x: 0.270
    # 底盘中心到左/右轮心的 y 半轴偏置（m），不是完整轮心距。
    wheel_base_y: 0.270
    # 42.5 mm 含包胶后的最终滚动半径；实车必须与下位机固件口径一致。
    wheel_radius: 0.0425
    drive_gear_ratio: 1.0
    steer_gear_ratio: 1.0
    motor_max_rpm: 450.0
    steer_max_rpm: 120.0
    actuator_redundancy: 1.2
    max_wheel_speed: 1.6689711
    # 台架单自由度标定（P6 四.3，下一轮）前仍为仿真初值。
    max_wheel_acceleration: 2.0
    max_steer_rate: 10.4719755
