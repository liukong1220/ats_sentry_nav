ats_swerve_mpc:
  ros__parameters:
    # 时间基准。本文件只服务包内独立 launch（`ats_swerve_mpc.launch.py`，默认 true）。
    # 两个 MuJoCo 入口（`mujoco_navigation.launch.py`、`rmuc_2026_mujoco.launch.py`）
    # 的 `use_sim_time` 默认是 false（顶层挂钟）并在节点上显式覆盖，因此这里的 true
    # 对它们不生效，不要据此判断闭环回归的时钟源。
    # 实车不读本文件，实车权威是 `ats_swerve_mpc_reality.yaml`（false）。
    use_sim_time: true
    # 当前车体状态来源，必须与参考轨迹处于同一 frame。
    odom_topic: /localization
    # MINCO 发布的连续参考路径输入。
    trajectory_topic: /minco/reference_path
    # P4 authorization is atomic.  When non-empty, legacy Path cannot install
    # or revive a tracker and legacy Bool false cannot release a stop.
    execution_command_topic: /planner/execution_command
    # MPC 与 cmd_vel_arbiter 共同校验 ExecutionCommand.header.stamp：未来或超过
    # execution_command_timeout 的 transient-local 旧样本一律 fail-stop，不能装载旧 reference。
    execution_command_timeout: 0.5
    gimbal_status_topic: /gimbal/yaw_status
    require_gimbal_status: true
    gimbal_status_timeout: 0.5
    # MPC 唯一自主速度输出；必须先经 cmd_vel_arbiter 到 selected。
    command_topic: /cmd_vel/autonomy_raw
    # true 时立即清空 warm start 并发布零速度；设为空可关闭该输入。
    emergency_stop_topic: /planner/emergency_stop
    # 定位健康与 epoch；收到非 TRACKING 或 epoch 跳变时清空 tracker 并双零。
    localization_status_topic: /localization/status
    # P4 必须为 true；P3 legacy 由 launch 覆盖为 false，避免依赖不存在的状态源。
    require_localization_status: true
    # 急停 heartbeat 的 steady-clock 租约；超时后清空旧 reference 并持续发布零速度。
    emergency_stop_timeout: 0.5
    # MPC 接受的状态与轨迹坐标系。
    frame_id: odom
    # 控制器计算频率（Hz），与预测时域离散步长 dt 解耦；首步按每拍实测 step_dt 积分/限幅。
    control_rate_hz: 50.0
    # 输入 Path 缺少单点时间戳时，相邻点使用的兜底时间间隔（s）。
    fallback_path_dt: 0.1
    # 轨迹跟踪超时附加宽限（s），用于容忍通信与执行延迟。
    trajectory_timeout: 0.5
    # 到达目标的位置误差阈值（m）。
    goal_position_tolerance: 0.08
    # 到达目标的航向误差阈值（rad）。
    goal_yaw_tolerance: 0.15
    # 是否发布预测轨迹和参考预测域，供 RViz 与回归脚本检查。
    publish_debug_paths: true

    # 唯一求解器：OSQP v1.0.0 零分配稀疏 SQP-RTI（未通过准入即确定性零速度 fail-stop）。
    solver_mode: qp
    qp_max_iterations: 400
    qp_time_limit_ms: 12.0
    qp_max_primal_residual: 2.0e-3
    qp_max_dual_residual: 5.0e-3
    qp_max_tracking_slack: 0.35
    qp_max_hard_constraint_violation: 2.0e-3
    qp_rti_iterations: 1
    qp_rti_second_pass_delta_threshold: 0.15
    planning_snapshot_topic: /rog_map_adapter/planning_snapshot
    require_planning_snapshot: true
    planning_snapshot_timeout_sec: 5.0
    footprint_length: 0.581
    footprint_width: 0.571
    footprint_safety_margin: 0.02
    qp_esdf_corridor_enabled: true
    qp_esdf_corridor_clearance: 0.44
    qp_esdf_reference_margin: 0.015
    qp_esdf_min_corridor_clearance: 0.3055
    qp_esdf_slack_linear_weight: 80.0
    qp_esdf_slack_quadratic_weight: 400.0
    rollout_safety_enabled: true
    lag_weight: 15.0
    contour_weight: 24.0
    actuator_lag_tau_sec: 0.025
    actuator_delay_sec: 0.010
    # 0 保持滚动 telemetry；QP 对照采样由 MuJoCo launch 显式覆盖为固定周期数。
    telemetry_sampling_window_cycles: 0

    # 从上次进度向后允许重新投影的时间窗口（s），用于吸收小幅定位抖动。
    projection_backward_window: 0.20
    # 从上次进度向前允许搜索的最大时间窗口（s），防止误投影到远处路径段。
    projection_forward_window: 2.00
    # 横向误差超过该值（m）后开始减慢参考进度。
    cross_track_slowdown_start: 0.15
    # 横向误差达到该值（m）时降到最小参考进度倍率。
    cross_track_slowdown_end: 0.60
    # 偏离路径严重时仍保留的最小参考进度/前馈速度比例，范围为 0 到 1。
    min_reference_progress_scale: 0.10
    # 预测域起点补偿的命令传输延迟（s）。
    command_latency_compensation: 0.01

    # OSQP SQP-RTI 预测时长 26*0.10=2.6 s，覆盖 5 m/s 在 2 m/s² 下的 2.5 s 完整制动时间；
    # 首步按 50 Hz 实测 step_dt (0.02 s) 执行，与预测步长 dt 解耦。
    horizon: 26
    dt: 0.10

    # 状态误差权重，对应世界系 [x, y, yaw]。
    state_weight: [18.0, 18.0, 10.0]
    # 预测末端状态误差权重，通常大于过程权重以保证收敛到目标。
    terminal_weight: [28.0, 28.0, 8.0]
    # 控制偏离参考的权重，对应车体系 [vx, vy, wz]。
    control_weight: [0.12, 0.12, 0.08]
    # 相邻控制量变化的权重，用于抑制舵轮速度/角速度突变。
    control_delta_weight: [0.70, 0.70, 0.60]

    # 车体系前后最大速度（m/s）；实车需按轮速能力重新标定。
    max_vx: 5.0
    # 车体系横移最大速度（m/s）；这是舵轮全向能力，不应设为零。
    max_vy: 5.0
    # 最大 yaw 角速度（rad/s）。
    max_wz: 3.0
    # 车体系前后最大加速度（m/s^2）。
    max_ax: 2.0
    # 车体系横移最大加速度（m/s^2）。
    max_ay: 2.0
    # 最大 yaw 角加速度（rad/s^2）。
    max_awz: 2.0
    # 底盘中心到前/后轮心的 x 半轴偏置（m），不是完整轮心距。
    wheel_base_x: 0.270
    # 底盘中心到左/右轮心的 y 半轴偏置（m），不是完整轮心距。
    wheel_base_y: 0.270
    # 42.5 mm 是包含包胶后的最终滚动半径；rubber_thickness 不再叠加。
    wheel_radius: 0.0425
    # 减速比统一定义为电机转速/轮端转速。
    drive_gear_ratio: 1.0
    steer_gear_ratio: 1.0
    motor_max_rpm: 1348.1359885
    steer_max_rpm: 120.0
    actuator_redundancy: 1.2
    # 显式5 m/s暂定轮速；等效电机转速按1.2冗余反推，待实测标定。
    max_wheel_speed: 5.0
    # 逐轮速度向量变化上限（m/s^2）；P4 仿真初值，仍需电机电流与实车阶跃标定。
    max_wheel_acceleration: 2.0
    # 逐轮运动中目标舵角变化上限（rad/s）；当前等于 120 rpm / 1.2。
    max_steer_rate: 10.4719755
