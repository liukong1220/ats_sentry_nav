ats_rog_map_adapter:
  ros__parameters:
    # 这份文件同时被实车 `bringup.launch.py` 与 MuJoCo 入口引用，两处都显式覆盖
    # `use_sim_time`。文件级默认取实车值 false：投影快照的 deadline、心跳 10 Hz 与
    # 0.5 s steady-clock 租约都以挂钟为基准，默认 true 会在覆盖失效时把 stale
    # 判据整体失真。仿真侧由 launch 的 use_sim_time 参数负责置 true。
    use_sim_time: false
    projection_service: /rog_map/get_ground_projection
    # The 100 x 100 x 7 numerical projection takes 0.9--3.2 s in the
    # MuJoCo CPU profile. Do not queue another request while its immutable
    # snapshot is still being built; ROGMap's 2.0 s source-health gate
    # remains the authority for sensor freshness.
    projection_rate_hz: 0.5
    projection_request_timeout_sec: 4.0
    projection_snapshot_timeout_sec: 4.0
    # CPU projection latency was measured at up to 1.794 s; both sources
    # still have to pass the independent 2.0 s freshness gate below.
    input_sync_tolerance_sec: 1.8
    # At 0.10 m voxels, start at z=0.15 m so flat-ground hits centered at z=-0.05 m
    # do not enter the ground-planning projection. Terrain layers retain low-step semantics.
    projection_min_height: 0.10
    projection_max_height: 0.80
    planning_resolution: 0.10

    static_map_topic: /map
    traversability_grid_topic: /traversability_grid
    traversability_slope_grid_topic: /traversability_slope_grid
    planning_grid_topic: /rc_esdf/planning_grid
    signed_distance_grid_topic: /rc_esdf/signed_distance_grid
    footprint_clearance_grid_topic: /rc_esdf/footprint_clearance_grid
    ready_topic: /rog_map_adapter/ready
    generation_topic: /rog_map_adapter/generation
    map_status_topic: /rog_map_adapter/status
    localization_status_topic: /localization/status
    # Formal profile: localization health is an execution precondition.
    # MuJoCo explicitly overrides this controlled simulation-only gate to false.
    require_localization_status: true
    localization_status_timeout_sec: 1.0

    static_obstacle_value_threshold: 50
    terrain_obstacle_value_threshold: 50
    slope_grid_max_degrees: 45.0
    slope_obstacle_degrees: 28.0
    unknown_is_obstacle: true
    input_timeout_sec: 2.0
    signed_distance_max_m: 2.0
    footprint_length: 0.70
    footprint_width: 0.55
    footprint_safety_margin: 0.05
    robot_frame: gimbal_yaw_odom
    # Disabled in P2: a yaw-free circle would clear unknown outside the rectangular footprint.
    robot_unknown_clear_radius: 0.0
